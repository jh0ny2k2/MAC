    <text x="110" y="537" font-family="Inter, sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="600">1:24</text>
    <rect x="60" y="494" width="80" height="20" rx="3" fill="rgba(255,255,255,0.08)"/>
    <text x="100" y="508" font-family="Inter, sans-serif" font-size="10" fill="rgba(255,255,255,0.6)" text-anchor="middle">BBURAGO</text>
