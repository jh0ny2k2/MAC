<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#32F08C"/>
      <stop offset="100%" stop-color="#1FD98A"/>
    </linearGradient>
  </defs>

  <!-- App background (rounded square) -->
  <rect width="512" height="512" rx="116" fill="#0A0B0D"/>

  <!-- Stacked layers: depth of a photo album -->
  <rect x="152" y="112" width="248" height="248" rx="26" fill="#16191C"/>
  <rect x="124" y="140" width="248" height="248" rx="26" fill="#1F2429"/>

  <!-- Front photo -->
  <rect x="96" y="168" width="248" height="248" rx="26" fill="#2A3036"/>

  <!-- Inner photo area -->
  <rect x="104" y="176" width="232" height="232" rx="20" fill="#0A0B0D"/>

  <!-- Point of light -->
  <circle cx="248" cy="270" r="56" fill="url(#glow)" opacity="0.18"/>
  <circle cx="248" cy="270" r="34" fill="#32F08C"/>
  <circle cx="240" cy="262" r="10" fill="#A9FFD6" opacity="0.55"/>
</svg>
